services:
  app:
    image: biswojit640/studynest-api:${VERSION}

    container_name: studynest-app

    restart: unless-stopped

    ports:
      - "127.0.0.1:4040:4040"

    env_file:
      - .env

    depends_on:
      - redis
    
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4040/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: biswojit640/studynest-api:${VERSION}

    command: node dist/worker/worker.js

    restart: unless-stopped

    deploy:
      replicas: 3

    env_file:
      - .env

    depends_on:
      - redis

  redis:
    image: redis:7
    restart: unless-stopped