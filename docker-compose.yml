services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: studynest-app

    ports:
      - "4040:4040"

    env_file:
      - .env

    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command: node dist/worker/worker.js

    deploy:
      replicas: 3

    env_file:
      - .env

    depends_on:
      - redis

  redis:
    image: redis:7