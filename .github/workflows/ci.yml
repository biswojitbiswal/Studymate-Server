name: Studynest CI

on:
  push:
    branches:
      - main

concurrency:
  group: studynest-production
  cancel-in-progress: false

env:
  VERSION: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t biswojit640/studynest-api:$VERSION .

      - name: Push Docker image
        run: docker push biswojit640/studynest-api:$VERSION

      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          envs: VERSION
          script: |
            set -eu
            if [ -z "${VERSION:-}" ]; then
              echo "ERROR: VERSION is empty."
              exit 1
            fi

            cd ~/studynest

            if [ ! -s .deployed-version ]; then
              echo "ERROR: .deployed-version is missing or empty."
              exit 1
            fi


            PREVIOUS_VERSION=$(cat .deployed-version)
            echo "Previous version: $PREVIOUS_VERSION"
            echo "Deploying version: $VERSION"

            rollback() {
              echo "Rolling back to $PREVIOUS_VERSION"

              if ! sudo env VERSION="$PREVIOUS_VERSION" docker compose pull app worker; then
                echo "ERROR: Failed to pull previous images."
                return 1
              fi

              if ! sudo env VERSION="$PREVIOUS_VERSION" docker compose up -d app worker; then
                sudo docker compose ps
                sudo docker inspect studynest-app \
                --format '{{.Config.Image}}'
                echo "ERROR: Failed to restore previous containers."
                return 1
              fi

              for i in $(seq 1 12); do
                if curl --fail --silent --show-error \
                  http://127.0.0.1:4040/api/v1/health/ready; then
                  echo "Rollback health check passed."
                  return 0
                fi
                sleep 10
              done

              echo "ERROR: Previous version did not become healthy."
              sudo docker compose ps
              sudo docker compose logs --tail=100 app worker
              return 1
            }

            if ! sudo env VERSION="$VERSION" docker compose pull app worker; then
              echo "ERROR: New image pull failed."
              exit 1
            fi

            if ! sudo env VERSION="$VERSION" docker compose up -d app worker; then
              echo "ERROR: New containers failed to start."
              rollback || true
              exit 1
            fi

            HEALTHY=false
            for i in $(seq 1 12); do
              if curl --fail --silent --show-error \
                http://127.0.0.1:4040/api/v1/health/ready; then
                HEALTHY=true
                break
              fi
              echo "Waiting for health check ($i/12)..."
              sleep 10
            done

            if [ "$HEALTHY" = true ]; then
              RUNNING_IMAGE=$(sudo docker inspect studynest-app --format '{{.Config.Image}}')
              EXPECTED_IMAGE="biswojit640/studynest-api:$VERSION"

              if [ "$RUNNING_IMAGE" != "$EXPECTED_IMAGE" ]; then
                echo "ERROR: Running image does not match the expected version."
                rollback
                exit 1
              fi

              # Verify that all 3 workers are running
              RUNNING_WORKERS=$(sudo docker compose ps --status running -q worker | wc -l)

              if [ "$RUNNING_WORKERS" -ne 3 ]; then
                echo "ERROR: Expected 3 running workers, found $RUNNING_WORKERS."
                rollback
                exit 1
              fi

              # Verify that all workers use the expected image
              WORKER_IMAGES=$(sudo docker compose ps --status running -q worker |
                xargs -r sudo docker inspect --format '{{.Config.Image}}' |
                sort -u)

              if [ "$WORKER_IMAGES" != "$EXPECTED_IMAGE" ]; then
                echo "ERROR: Worker images do not match the expected version."
                rollback
                exit 1
              fi

              printf '%s\n' "$VERSION" > .deployed-version
              echo "Deployment succeeded: $VERSION"
            else
              echo "ERROR: New deployment failed its health check."
              sudo docker compose ps
              sudo docker compose logs --tail=100 app worker

              if rollback; then
                echo "Rollback completed."
              else
                echo "ERROR: Rollback failed."
              fi

              exit 1
            fi